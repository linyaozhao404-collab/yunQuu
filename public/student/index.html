<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生端 - QuizRush</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="logo">QUIZ<span>RUSH</span></div><div class="top-actions"><span class="pill" id="userPill">玩家</span><button class="pill dim" onclick="logout()">退出</button></div></header><main class="container" id="app"></main><div id="modal" class="modal hide"></div><script src="/socket.io/socket.io.js"></script><script>
const app=document.querySelector('#app'),modal=document.querySelector('#modal');let token=localStorage.getItem('qr_token'),me=null,pin='',name='',avatar='rocket',state=null,locked=false,selectedOrder=[],bgm=false,oscTimer,clockTimer;const EM={rocket:'🚀',fox:'🦊',cat:'🐱',robot:'🤖',dragon:'🐲',panda:'🐼',alien:'👽',ninja:'🥷',tiger:'🐯',lion:'🦁',penguin:'🐧',koala:'🐨',owl:'🦉',shark:'🦈',unicorn:'🦄',slime:'🟢',wizard:'🧙',knight:'🛡️',monkey:'🐵',hamster:'🐹'};const socket=io();
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function boot(){try{const r=await api('/api/auth/me');me=r.user;document.querySelector('#userPill').textContent=me.displayName;joinPage()}catch(e){showAuth()}}
function showAuth(){modal.classList.remove('hide');modal.innerHTML=`<div class="modal-card"><h2>学生账号</h2><p class="muted">账号用于保存游戏历史与成绩统计。</p><div class="auth-toggle"><button class="action-btn primary" onclick="authMode('login')">登录</button><button class="action-btn plain" onclick="authMode('register')">注册</button></div><div id="authForm"></div></div>`;authMode('login')}
function authMode(mode){document.querySelector('#authForm').innerHTML=`<label>用户名</label><input id="au" placeholder="student"><label>密码</label><input id="ap" type="password" placeholder="至少6位">${mode==='register'?'<label>显示名</label><input id="ad" placeholder="例如：小王">':''}<div class="action-row"><button class="action-btn primary" onclick="submitAuth('${mode}')">${mode==='login'?'登录':'创建学生账号'}</button></div>`}
async function submitAuth(mode){try{const body={username:au.value,password:ap.value};if(mode==='register'){body.displayName=ad.value;body.role='student'}const r=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);if(mode==='register'){authMode('login');return}localStorage.setItem('qr_token',d.token);token=d.token;modal.classList.add('hide');location.reload()}catch(e){modal.querySelector('#authForm').insertAdjacentHTML('beforeend',`<div class="notice err">${esc(e.message)}</div>`)} }
function logout(){sessionStorage.removeItem('qr_room');sessionStorage.removeItem('qr_name');sessionStorage.removeItem('qr_avatar');localStorage.removeItem('qr_token');location.href='/'}
function joinPage(){const qp=new URLSearchParams(location.search).get('pin');if(qp&&!sessionStorage.getItem('qr_room'))pin=qp.trim();app.innerHTML=`<section class="panel center" style="max-width:720px;margin:50px auto"><h1>加入游戏</h1><input id="jp" inputmode="numeric" maxlength="6" value="${esc(pin)}" placeholder="123456" style="font-size:36px;text-align:center"><label>昵称</label><input id="jn" maxlength="20" value="${esc(me.displayName)}"><div class="action-row" style="justify-content:center"><button class="action-btn primary" onclick="chooseAvatar()">选择角色 →</button></div><div class="action-row" style="justify-content:center"><button class="action-btn plain" onclick="toggleBgm()">${bgm?'🔊':'🔇'} 音效/音乐</button></div></section>`}
function chooseAvatar(){const pinEl=document.getElementById('jp'),nameEl=document.getElementById('jn');pin=pinEl?pinEl.value.trim():pin;name=nameEl?nameEl.value.trim():name;if(pin.length!==6||!name)return alert('请填写正确的 PIN 和昵称');app.innerHTML=`<section class="panel center"><h1>选择你的角色</h1><div class="avatar-grid">${Object.entries(EM).map(([k,v])=>`<button type="button" class="avatar-btn ${k===avatar?'selected':''}" onclick="selectAvatar('${k}')"><div class="avatar">${v}</div><b>${k}</b></button>`).join('')}</div><div class="action-row" style="justify-content:center"><button class="action-btn primary" type="button" onclick="joinGame()">🚀 进入房间</button></div></section>`}
function selectAvatar(k){if(!EM[k])return;avatar=k;document.querySelectorAll('.avatar-btn').forEach(b=>b.classList.remove('selected'));const buttons=[...document.querySelectorAll('.avatar-btn')];const target=buttons.find(b=>b.getAttribute('onclick')===`selectAvatar('${k}')`);if(target)target.classList.add('selected')}
function joinGame(){sessionStorage.setItem('qr_room',pin);sessionStorage.setItem('qr_name',name);sessionStorage.setItem('qr_avatar',avatar);socket.emit('player:join',{pin,name,avatar,userId:me.id});}
socket.on('connect',()=>{const rp=sessionStorage.getItem('qr_room');if(me&&rp)socket.emit('player:resume',{pin:rp,userId:me.id})});socket.on('resume:failed',()=>{});socket.on('player:resumed',d=>{state=d.game;name=d.player.name;avatar=d.player.avatar;render()});socket.on('join:error',m=>alert(m));socket.on('player:joined',d=>{state=d.game;modal.classList.add('hide');playTone(700,.08);render()});socket.on('game:state',s=>{state=s;if(!locked||s.status!=='question')render()});socket.on('answer:result',r=>{locked=true;renderAnswerResult(r);});socket.on('question:ended',d=>{locked=true;renderTransition(d)});socket.on('powerup:used',()=>playTone(920,.08));
function render(){if(!state)return;if(state.status==='lobby')renderLobby();else if(state.status==='question')renderQuestion();else if(state.status==='transition')renderTransition({ranking:state.ranking});else renderFinished()}
function renderLobby(){app.innerHTML=`<section class="student-lobby"><div class="student-statebar"><div><span class="eyebrow">游戏大厅</span><strong>${esc(state.title)}</strong></div><span class="room-chip">PIN ${state.pin}</span></div><div class="student-avatar-large">${EM[avatar]}</div><h1>准备好了</h1><div class="player-name">${esc(name)}</div><div class="players-count">${state.players.length} 人已加入</div><div class="players">${state.players.map(p=>`<span class="player-chip">${EM[p.avatar]} ${esc(p.name)}</span>`).join('')}</div><div class="waiting-pulse">等待老师开始</div></section>`}
function renderQuestion(){clearInterval(clockTimer);locked=false;const q=state.question;selectedOrder=q.type==='order'?q.options.map((_,i)=>i):[];app.innerHTML=`<section class="student-game"><div class="student-statebar"><div><span class="eyebrow">${esc(state.title)}</span><strong>Q${state.current+1} / ${state.total}</strong></div><div class="student-hud"><span id="streakHud">🔥 0</span><span class="timer" id="qtimer">${q.time}s</span></div></div><div class="progress"><div id="pbar"></div></div><div class="question-card"><h1>${esc(q.text)}</h1>${mediaHtml(q)}</div><div class="powerups">${powerButton('double','×2',state.player?.powerups?.double)}${powerButton('time','+3秒',state.player?.powerups?.time)}${powerButton('shield','🛡',state.player?.powerups?.shield)}<button class="power plain" onclick="toggleBgm()">${bgm?'🔊':'🔇'}</button></div>${answerArea(q)}</section>`;startClock(q.time);startGameMusic()}
function powerButton(type,label,available){return `<button class="power ${available?'':'off'}" ${available?'':'disabled'} onclick="usePower('${type}')">${label}</button>`}
function usePower(type){if(type==='double')socket.emit('player:doubleNow',{pin});else socket.emit('player:powerup',{pin,type});playTone(550,.06)}
function answerArea(q){if(q.type==='multi')return `<div class="grid-2">${q.options.map((x,i)=>`<label class="multi-choice"><input type="checkbox" class="multi" value="${i}"><span>${esc(x)}</span></label>`).join('')}</div><div class="action-row" style="justify-content:center"><button class="action-btn primary" onclick="submitMulti()">提交答案</button></div>`;if(q.type==='order')return `<div class="order-list" id="orderList">${selectedOrder.map((idx,pos)=>orderItem(q,idx,pos)).join('')}</div><div class="action-row" style="justify-content:center"><button class="action-btn primary" onclick="submitOrder()">提交排序</button></div>`;return `<div class="answers">${q.options.map((x,i)=>`<button class="answer-btn a${i}" onclick="submitAnswer(${i},this)">${esc(x)}</button>`).join('')}</div>`}
function orderItem(q,idx,pos){return `<div class="order-item"><span>${pos+1}. ${esc(q.options[idx])}</span><span><button class="mini" onclick="moveOrder(${pos},-1)" ${pos===0?'disabled':''}>↑</button><button class="mini" onclick="moveOrder(${pos},1)" ${pos===selectedOrder.length-1?'disabled':''}>↓</button></span></div>`}
function moveOrder(pos,d){const n=pos+d;if(n<0||n>=selectedOrder.length)return;[selectedOrder[pos],selectedOrder[n]]=[selectedOrder[n],selectedOrder[pos]];document.querySelector('#orderList').innerHTML=selectedOrder.map((idx,i)=>orderItem(state.question,idx,i)).join('')}
function submitMulti(){if(locked)return;const vals=[...document.querySelectorAll('.multi:checked')].map(x=>Number(x.value));if(!vals.length)return alert('至少选择一项');lockAnswers();socket.emit('player:answer',{pin,answer:vals})}
function submitOrder(){if(locked)return;lockAnswers();socket.emit('player:answer',{pin,answer:selectedOrder})}
function submitAnswer(i){if(locked)return;lockAnswers();socket.emit('player:answer',{pin,answer:i})}
function lockAnswers(){locked=true;document.querySelectorAll('.answer-btn,.multi-choice,.mini').forEach(x=>x.classList.add('locked'));}
function renderAnswerResult(r){clearInterval(clockTimer);stopGameMusic();app.innerHTML=`<section class="feedback-screen ${r.correct?'correct':'wrong'}"><div class="feedback-burst">${r.correct?'✓':'×'}</div><div class="feedback-title">${r.correct?'太棒了！':'这题没拿到分'}</div><div class="score-pop">+${r.gained.toLocaleString()}</div><div class="feedback-score">当前总分 ${r.score.toLocaleString()}</div>${r.usedShield?'<div class="shield-note">🛡 护盾已触发</div>':''}${r.late?'<div class="shield-note">答案已超过统一结算窗口</div>':''}</section>`;playTone(r.correct?900:220,.15)}
function renderTransition(d){clearInterval(clockTimer);stopGameMusic();const meRank=(state.ranking||[]).find(p=>p.id===socket.id);app.innerHTML=`<section class="panel transition"><div><div class="icon">⚡</div><h1>同步结算中</h1><h2>当前排名：${meRank?'#'+meRank.rank:'—'}</h2><p>领先者：${d.ranking&&d.ranking[0]?esc(d.ranking[0].name):'—'}</p><div class="action-row" style="justify-content:center"><button class="action-btn plain" onclick="toggleBgm()">${bgm?'🔊':'🔇'} 音乐</button></div></div></section>`}
function renderFinished(){clearInterval(clockTimer);stopGameMusic();const meRank=state.ranking.find(p=>p.id===socket.id);const top=state.ranking.slice(0,3);app.innerHTML=`<section class="student-results center"><div class="eyebrow">最终结果</div><h1>🏁 全部完成</h1><div class="my-final"><div class="avatar celebrate">${EM[avatar]}</div><div class="final-rank">#${meRank?meRank.rank:'—'}</div><div class="score-pop">${meRank?meRank.score.toLocaleString():0}</div></div><div class="podium">${[1,0,2].map(i=>top[i]?`<div class="podium-place ${i===0?'place1':'place'+(i+1)} rank-pop" style="--delay:${i*120}ms"><div class="avatar celebrate">${EM[top[i].avatar]}</div><strong>${esc(top[i].name)}</strong><div class="podium-block">#${i+1}<br>${top[i].score.toLocaleString()}</div></div>`:'').join('')}</div><div class="leaderboard">${state.ranking.map((p,i)=>`<div class="rank-row rank-animate" style="--delay:${i*45}ms"><b>#${p.rank}</b><span>${EM[p.avatar]} ${esc(p.name)}</span><b>${p.score.toLocaleString()}</b></div>`).join('')}</div></section>`}
function startClock(sec){const end=state.questionEndsAt;const total=sec*1000;function tick(){const left=Math.max(0,end-Date.now()),t=document.querySelector('#qtimer'),b=document.querySelector('#pbar');if(t)t.textContent=Math.ceil(left/1000)+'s';if(b)b.style.width=(100-left/total*100)+'%';if(left<=0)clearInterval(clockTimer)}tick();clockTimer=setInterval(tick,100)}
function mediaHtml(q){return `${q.image?`<div class="media-question"><img src="${esc(q.image)}" alt="题目图片"></div>`:''}${q.audio?`<div class="media-question"><audio controls src="${esc(q.audio)}"></audio></div>`:''}${q.video?`<div class="media-question"><video controls src="${esc(q.video)}"></video></div>`:''}`}
function playTone(freq,dur){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.035;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},dur*1000)}catch{}}
function toggleBgm(){bgm=!bgm;if(bgm)startGameMusic();else stopGameMusic();}
function startGameMusic(){if(!bgm||oscTimer)return;let i=0;const notes=[261,329,392,523,392,329];oscTimer=setInterval(()=>playTone(notes[i++%notes.length],.06),420)}function stopGameMusic(){clearInterval(oscTimer);oscTimer=null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
boot();
</script></body></html>
