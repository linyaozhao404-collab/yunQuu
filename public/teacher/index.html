<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师端 - QuizRush</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="logo">QUIZ<span>RUSH</span></div><div class="top-actions"><span class="pill" id="userPill">教师</span><button class="pill dim" onclick="logout()">退出</button></div></header><main class="container" id="app"></main><div id="modal" class="modal hide"></div><script src="/socket.io/socket.io.js"></script><script>
const app=document.querySelector('#app'),modal=document.querySelector('#modal');let token=localStorage.getItem('qr_token'),me=null,selectedQuiz=null,pin=null,state=null,socket=io();let currentTab='quizzes',clockTimer;
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function boot(){try{const r=await api('/api/auth/me');me=r.user;if(me.role!=='teacher'&&me.role!=='admin')throw Error('此页面需要教师账号');document.querySelector('#userPill').textContent=me.displayName;renderDashboard()}catch(e){showAuth(e.message)}}
function showAuth(msg=''){modal.classList.remove('hide');modal.innerHTML=`<div class="modal-card"><h2>教师登录</h2>${msg?`<div class="notice err">${esc(msg)}</div>`:''}<div class="auth-toggle"><button class="action-btn primary" onclick="authMode('login')">登录</button><button class="action-btn plain" onclick="authMode('register')">注册</button></div><div id="authForm"></div></div>`;authMode('login')}
function authMode(mode){document.querySelector('#authForm').innerHTML=`<label>用户名</label><input id="au" placeholder="teacher"><label>密码</label><input id="ap" type="password" placeholder="至少6位">${mode==='register'?'<label>显示名</label><input id="ad" placeholder="老师名字">':''}<div class="action-row"><button class="action-btn primary" onclick="submitAuth('${mode}')">${mode==='login'?'登录':'创建教师账号'}</button></div>`}
async function submitAuth(mode){try{const body={username:au.value,password:ap.value};if(mode==='register'){body.displayName=ad.value;body.role='teacher'}const r=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);if(mode==='register'){modal.querySelector('.modal-card').insertAdjacentHTML('beforeend','<div class="notice ok">注册成功，请登录。</div>');authMode('login');return}localStorage.setItem('qr_token',d.token);token=d.token;modal.classList.add('hide');location.reload()}catch(e){modal.querySelector('.modal-card').insertAdjacentHTML('beforeend',`<div class="notice err">${esc(e.message)}</div>`)} }
function logout(){localStorage.removeItem('qr_token');location.href='/'}
async function renderDashboard(){app.innerHTML=`<section class="panel"><div class="tabs"><button class="tab ${currentTab==='quizzes'?'active':''}" onclick="currentTab='quizzes';renderDashboard()">题库</button><button class="tab ${currentTab==='editor'?'active':''}" onclick="currentTab='editor';renderDashboard()">创建题库</button><button class="tab ${currentTab==='import'?'active':''}" onclick="currentTab='import';renderDashboard()">文稿导入</button><button class="tab ${currentTab==='history'?'active':''}" onclick="currentTab='history';renderDashboard()">游戏历史</button><button class="tab ${currentTab==='stats'?'active':''}" onclick="currentTab='stats';renderDashboard()">成绩统计</button><a class="tab" href="/admin/">管理员</a></div><div id="tabContent"></div></section>`;const c=document.querySelector('#tabContent');if(currentTab==='quizzes')await renderQuizzes(c);if(currentTab==='editor')renderEditor(c);if(currentTab==='import')renderImporter(c);if(currentTab==='history')await renderHistory(c);if(currentTab==='stats')await renderStats(c)}
async function renderQuizzes(c){const qs=await api('/api/quizzes?mine=1');c.innerHTML=`<div class="search-row"><input id="search" placeholder="搜索题库 / 标签 / 描述"><button class="action-btn cyan" onclick="doSearch()">搜索</button></div><div class="grid grid-3" style="margin-top:18px">${qs.map(q=>`<div class="quiz-card" onclick="selectedQuiz='${q.id}';hostGame()"><h3>${esc(q.title)}</h3><p>${esc(q.description||'')}</p><div>${q.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p>${q.count} 道题</p><button class="action-btn primary">创建游戏</button></div>`).join('')}</div>`}
async function doSearch(){const q=document.querySelector('#search').value;const qs=await api('/api/quizzes?mine=1&q='+encodeURIComponent(q));document.querySelector('.grid-3').innerHTML=qs.map(x=>`<div class="quiz-card" onclick="selectedQuiz='${x.id}';hostGame()"><h3>${esc(x.title)}</h3><p>${esc(x.description||'')}</p><div>${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p>${x.count} 道题</p><button class="action-btn primary">创建游戏</button></div>`).join('')||'<p class="muted">没有找到题库。</p>'}

function renderImporter(c){c.innerHTML=`<div class="import-head"><div><h2>文稿 → 题目</h2></div><div class="format-tip"><b>推荐格式</b><br>1. 中国最长的河流是哪一条？<br>A. 黄河<br>B. 长江<br>C. 珠江<br>D. 黑龙江<br>答案：B<br>类型：单选题</div></div><div class="grid grid-2"><div><label>直接粘贴文稿</label><textarea id="importText" style="min-height:300px" placeholder="把老师的题目文稿粘贴到这里……"></textarea><div class="action-row"><button class="action-btn primary" onclick="parsePasted()">🔍 解析文稿</button><label class="file-btn action-btn secondary">📄 上传 TXT / MD / CSV / TSV / DOCX / XLSX<input id="importFile" type="file" accept=".txt,.md,.csv,.tsv,.docx,.xlsx,.xls" hidden onchange="parseFile()"></label></div></div><div><h3>支持的格式</h3><div class="notice">① 单选：答案填写 A / B / C / D</div><div class="notice">② 判断：答案填写 正确 / 错误，类型：判断题</div><div class="notice">③ 多选：答案填写 ABC，类型：多选题</div><div class="notice">④ 排序：答案填写 ABCD，类型：排序题</div><div class="notice">⑤ Excel：第一行用“题目、A、B、C、D、答案、时间、题型”作为列名</div><div id="importMsg" class="notice">解析结果会显示在这里。</div></div></div><div id="importPreview" style="margin-top:22px"></div>`}
async function parsePasted(){try{const text=document.querySelector('#importText').value;const r=await api('/api/import/parse',{method:'POST',body:JSON.stringify({text})});showImportPreview(r.questions)}catch(e){document.querySelector('#importMsg').textContent=e.message}}
async function parseFile(){try{const f=document.querySelector('#importFile').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/api/import/file',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error);showImportPreview(d.questions);document.querySelector('#importMsg').textContent=`已读取 ${f.name}，识别 ${d.count} 道题`;}catch(e){document.querySelector('#importMsg').textContent=e.message}}
let importedQuestions=[];
function showImportPreview(qs){importedQuestions=qs;document.querySelector('#importMsg').textContent=`识别成功：${qs.length} 道题。请检查后导入。`;document.querySelector('#importPreview').innerHTML=`<div class="panel" style="padding:18px"><div class="import-actions"><input id="importTitle" value="导入题库 ${new Date().toLocaleDateString()}" placeholder="题库名称"><button class="action-btn primary" onclick="saveImportedQuiz()">✅ 导入为题库</button></div>${qs.map((q,i)=>`<div class="question-preview"><div class="qp-title"><b>${i+1}. ${esc(q.text)}</b><span class="tag">${typeName(q.type)}</span></div><div>${q.options.map((o,j)=>`<span class="preview-opt ${isCorrect(q,j)?'correct':''}">${String.fromCharCode(65+j)}. ${esc(o)}</span>`).join('')}</div><small>答案：${answerLabel(q)}</small></div>`).join('')}</div>`}
function typeName(t){return {single:'单选题',truefalse:'判断题',multi:'多选题',order:'排序题'}[t]||'单选题'}
function isCorrect(q,i){return Array.isArray(q.answer)?q.answer.includes(i):q.answer===i}
function answerLabel(q){return Array.isArray(q.answer)?q.answer.map(i=>String.fromCharCode(65+i)).join('')||'—':String.fromCharCode(65+Number(q.answer))}
async function saveImportedQuiz(){try{const title=document.querySelector('#importTitle').value.trim();if(!title)throw Error('请输入题库名称');await api('/api/quizzes',{method:'POST',body:JSON.stringify({title,description:'通过规则解析器导入，无 AI',tags:['导入'],questions:importedQuestions})});selectedQuiz=null;currentTab='quizzes';renderDashboard()}catch(e){alert(e.message)}}
function renderEditor(c){c.innerHTML=`<h2>创建题库</h2><label>题库标题</label><input id="qtitle" value="我的课堂挑战"><label>描述</label><input id="qdesc" placeholder="课堂测验、复习、暖场…"><label>标签（逗号分隔）</label><input id="qtags" placeholder="数学,七年级"><div id="blocks"></div><div class="action-row"><button class="action-btn secondary" onclick="addQuestion()">＋ 添加题目</button><button class="action-btn primary" onclick="saveQuiz()">保存题库</button></div>`;addQuestion();}
function addQuestion(){const wrap=document.querySelector('#blocks');const id='b'+Date.now()+Math.random();wrap.insertAdjacentHTML('beforeend',`<div class="question-editor" id="${id}"><label>题型</label><select class="qt-type" onchange="typeChanged(this)"><option value="single">单选题</option><option value="truefalse">判断题</option><option value="multi">多选题</option><option value="order">排序题</option></select><label>题目</label><textarea class="qt-text" placeholder="输入问题"></textarea><label>答题时间（秒）</label><input class="qt-time" type="number" min="5" max="180" value="15"><label>图片 URL（可选）</label><input class="qt-image" placeholder="https://..."><label>音频 URL（可选）</label><input class="qt-audio" placeholder="https://.../audio.mp3"><label>视频 URL（可选）</label><input class="qt-video" placeholder="https://.../video.mp4"><div class="opts"></div><button class="action-btn danger" onclick="this.closest('.question-editor').remove()">删除题目</button></div>`);const b=document.getElementById(id);typeChanged(b.querySelector('.qt-type'))}
function typeChanged(sel){const b=sel.closest('.question-editor'),type=sel.value,opts=b.querySelector('.opts');if(type==='truefalse'){opts.innerHTML=`<label>正确答案</label><select class="answer-single"><option value="0">正确</option><option value="1">错误</option></select>`;return}opts.innerHTML=[0,1,2,3].map((i)=>`<div class="option-row"><input class="opt" placeholder="选项 ${String.fromCharCode(65+i)}"><select class="answerMark"><option value="0">错误</option><option value="1">正确</option></select></div>`).join('')+(type==='order'?'<p class="small">排序题：用“正确”标记的顺序必须按题目选项原顺序填写；学生会通过上下移动重排。</p>':type==='multi'?'<p class="small">多选题：可以将多个选项标为正确。</p>':'')}
async function saveQuiz(){try{const questions=[...document.querySelectorAll('.question-editor')].map(b=>{const type=b.querySelector('.qt-type').value,opts=[...b.querySelectorAll('.opt')].map(x=>x.value).filter(Boolean),marks=[...b.querySelectorAll('.answerMark')].map(x=>x.value==='1');let answer=0;if(type==='truefalse')answer=Number(b.querySelector('.answer-single').value);else if(type==='multi')answer=marks.map((v,i)=>v?i:-1).filter(i=>i>=0);else if(type==='order'){const correct=marks.map((v,i)=>v?i:-1).filter(i=>i>=0);answer=correct.length?correct:[...opts.keys()]}else{const i=marks.findIndex(Boolean);answer=i<0?0:i}return {type,text:b.querySelector('.qt-text').value,options:opts,answer,time:Number(b.querySelector('.qt-time').value)||15,image:b.querySelector('.qt-image').value,audio:b.querySelector('.qt-audio').value,video:b.querySelector('.qt-video').value}});if(!questions.length)throw Error('至少添加1道题');await api('/api/quizzes',{method:'POST',body:JSON.stringify({title:qtitle.value,description:qdesc.value,tags:qtags.value.split(',').map(s=>s.trim()).filter(Boolean),questions})});currentTab='quizzes';renderDashboard()}catch(e){alert(e.message)}}
async function hostGame(){if(!selectedQuiz)return;const r=await api('/api/games',{method:'POST',body:JSON.stringify({quizId:selectedQuiz})});pin=r.pin;socket.emit('teacher:host',{pin})}
socket.on('teacher:ready',s=>{state=s;renderHost()});socket.on('game:state',s=>{state=s;renderHost()});socket.on('error:message',m=>alert(m));
function renderHost(){const c=document.querySelector('#tabContent')||app;if(!state)return;if(state.status==='lobby'){c.innerHTML=`<div class="game-statebar"><div><span class="eyebrow">游戏大厅</span><strong>${esc(state.title)}</strong></div><div class="state-metrics"><span><b>${state.players.length}</b> 玩家</span><span><b>${state.total}</b> 题</span></div></div><div class="lobby-layout"><div class="lobby-main"><div class="pin-label">输入 / 扫码加入</div><div class="pin">${state.pin}</div><div class="players">${state.players.map(p=>`<span class="player-chip">${avatarEmoji(p.avatar)} ${esc(p.name)}</span>`).join('')||'<span class="empty-state">等待玩家加入</span>'}</div><div class="action-row" style="justify-content:center"><button class="action-btn primary xl-btn" onclick="socket.emit('teacher:start',{pin})">🚀 启动游戏</button><button class="action-btn plain" onclick="state=null;currentTab='quizzes';renderDashboard()">返回题库</button></div></div><aside class="qr-card"><div class="qr-title">扫码加入</div><img id="qrImg" alt="加入游戏二维码"><div class="join-url" id="joinUrl"></div></aside></div>`;loadQR()}else if(state.status==='question'){const q=state.question;c.innerHTML=`<div class="game-statebar"><div><span class="eyebrow">正在进行</span><strong>${esc(state.title)}</strong></div><div class="state-metrics"><span><b>Q${state.current+1}</b> / ${state.total}</span><span><b>${state.answeredCount||0}</b> / ${state.players.length} 已答</span></div></div><div class="question-shell"><div class="question-meta"><span>第 ${state.current+1} 题</span><span>已答 ${state.answeredCount||0} / ${state.players.length}</span></div><div class="timer" id="t"></div><div class="progress"><div id="bar"></div></div><h1>${esc(q.text)}</h1>${mediaHtml(q)}<div class="answers">${q.options.map((x,i)=>`<div class="answer-btn a${i}">${esc(x)}</div>`).join('')}</div></div>`;startTeacherClock()}else if(state.status==='transition'){c.innerHTML=`<div class="transition"><div class="transition-card"><div class="icon">⚡</div><div class="eyebrow">Q${state.current+1} 结算</div><h1>锁定答案</h1><p class="transition-copy">所有设备统一结算，下一题马上开始。</p><div class="leaderboard compact">${state.ranking.slice(0,5).map((p,i)=>`<div class="rank-row rank-animate" style="--delay:${i*80}ms"><b>#${p.rank}</b><span>${avatarEmoji(p.avatar)} ${esc(p.name)}</span><b>${p.score.toLocaleString()}</b></div>`).join('')}</div><button class="action-btn primary xl-btn" onclick="socket.emit('teacher:next',{pin})">${state.current+1<state.total?'下一题 →':'查看最终结果'}</button></div></div>`}else if(state.status==='finished')renderResults(c)}
async function loadQR(){try{const url=location.origin+'/student/?pin='+encodeURIComponent(state.pin);const r=await fetch('/api/qr?url='+encodeURIComponent(url));const d=await r.json();if(d.dataUrl)document.querySelector('#qrImg').src=d.dataUrl;const u=document.querySelector('#joinUrl');if(u)u.textContent=url}catch(e){}}
function startTeacherClock(){clearInterval(clockTimer);const end=state.questionEndsAt;const total=state.question.time*1000;clockTimer=setInterval(()=>{const left=Math.max(0,end-Date.now()),t=document.querySelector('#t'),b=document.querySelector('#bar');if(t)t.textContent=Math.ceil(left/1000)+'s';if(b)b.style.width=(100-left/total*100)+'%';if(left<=0)clearInterval(clockTimer)},100)}
function renderResults(c){const top=state.ranking.slice(0,3);c.innerHTML=`<div class="results-screen center"><div class="eyebrow">最终结果</div><h1>🏆 冠军诞生</h1><div class="mvp-card"><div class="mvp-kicker">MVP</div><div class="avatar celebrate">${top[0]?avatarEmoji(top[0].avatar):'🏆'}</div><strong>${top[0]?esc(top[0].name):'—'}</strong><div class="score-pop">${top[0]?top[0].score.toLocaleString():0}</div></div><div class="podium">${[1,0,2].map(i=>top[i]?`<div class="podium-place ${i===0?'place1':'place'+(i+1)} rank-pop" style="--delay:${i*120}ms"><div class="avatar celebrate">${avatarEmoji(top[i].avatar)}</div><strong>${esc(top[i].name)}</strong><div class="podium-block">#${i+1}<br>${top[i].score.toLocaleString()}</div></div>`:'').join('')}</div><div class="leaderboard">${state.ranking.map((p,i)=>`<div class="rank-row rank-animate" style="--delay:${i*45}ms"><b>#${p.rank}</b><span>${avatarEmoji(p.avatar)} ${esc(p.name)}</span><b>${p.score.toLocaleString()}</b></div>`).join('')}</div><button class="action-btn primary xl-btn" onclick="state=null;currentTab='history';renderDashboard()">查看游戏历史</button></div>`}
async function renderHistory(c){const h=await api('/api/history');c.innerHTML=`<h2>游戏历史</h2>${h.length?`<table class="table"><tr><th>标题</th><th>PIN</th><th>时间</th><th>人数</th><th>冠军</th></tr>${h.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.pin}</td><td>${new Date(x.finishedAt).toLocaleString()}</td><td>${x.players.length}</td><td>${x.players[0]?esc(x.players[0].name):'—'}</td></tr>`).join('')}</table>`:'<div class="center"><div style="font-size:56px">📭</div><h3>暂无记录</h3></div>'}`}
async function renderStats(c){const s=await api('/api/stats');c.innerHTML=`<h2>成绩统计</h2><div class="stats">${s.map(x=>`<div class="stat"><span>${esc(x.label)}</span><b>${x.value}</b></div>`).join('')}</div>`}
function mediaHtml(q){return `${q.image?`<div class="media-question"><img src="${esc(q.image)}" alt="题目图片"></div>`:''}${q.audio?`<div class="media-question"><audio controls src="${esc(q.audio)}"></audio></div>`:''}${q.video?`<div class="media-question"><video controls src="${esc(q.video)}"></video></div>`:''}`}
function avatarEmoji(a){return {rocket:'🚀',fox:'🦊',cat:'🐱',robot:'🤖',dragon:'🐲',panda:'🐼',alien:'👽',ninja:'🥷',tiger:'🐯',lion:'🦁',penguin:'🐧',koala:'🐨',owl:'🦉',shark:'🦈',unicorn:'🦄',slime:'🟢',wizard:'🧙',knight:'🛡️',monkey:'🐵',hamster:'🐹'}[a]||'🙂'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
boot();
</script></body></html>
