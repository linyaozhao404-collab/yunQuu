<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizRush 管理后台</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="logo">QUIZ<span>RUSH</span></div><div class="top-actions"><a class="pill" href="/">返回首页</a><button class="pill" onclick="logout()">退出</button></div></header><main class="container" id="app"></main><script>
let token=localStorage.getItem('qr_token');const app=document.querySelector('#app');async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}async function boot(){try{const m=await api('/api/auth/me');if(m.user.role!=='admin')throw Error('需要管理员账号');const s=await api('/api/admin/summary');const u=await api('/api/admin/users');app.innerHTML=`<section class="panel"><h1>管理员后台</h1><div class="stats">${Object.entries({用户:s.users,教师:s.teachers,学生:s.students,题库:s.quizzes,历史场次:s.games,活动房间:s.activeRooms}).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><h2>用户</h2><table class="table"><tr><th>用户名</th><th>显示名</th><th>角色</th></tr>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.displayName)}</td><td>${esc(x.role)}</td></tr>`).join('')}</table></section>`}catch(e){app.innerHTML=`<section class="panel center"><h1>无权限</h1><p>${esc(e.message)}</p><a class="action-btn primary" href="/">返回</a></section>`}}async function logout(){try{await api('/api/auth/logout')}catch{}localStorage.removeItem('qr_token');location.href='/'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}boot();</script></body></html>
